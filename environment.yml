# Conda environment for running the gdex-examples notebooks locally.
#
# Lists direct dependencies only — versions resolve to a compatible set at
# install time. For the exact pinned environment used to render the site
# on NCAR Casper, see `environment-lock.txt` (pip freeze output).
#
# Usage:
#   conda env create -f environment.yml
#   conda activate gdex-examples

name: gdex-examples
channels:
  - conda-forge
dependencies:
  - python=3.12        # pin a version: Binder/repo2docker falls back to 3.10 for a range, which breaks the solve

  # Core scientific Python
  - numpy
  - pandas
  - scipy
  - xarray
  - matplotlib-base
  - seaborn

  # Geospatial / climate
  - cartopy
  - nc-time-axis
  - cf-units          # conda-forge name is hyphenated; "cf_units" only has ≤py3.7 builds and breaks the solve
  - geocat-comp
  - xradar
  - cmweather
  - rioxarray         # mesaclip_regrid_sst
  - folium            # mesaclip_regrid_sst, raf_socrates

  # Data access and catalogs
  - intake
  - intake-esm
  - kerchunk          # engine="kerchunk" — CONUS404, SAAG, MAAG, MESACLIP, heatindex
  - zarr
  - fsspec
  - aiohttp
  - netcdf4
  - h5netcdf
  - requests

  # Parallel compute
  - dask
  - distributed
  - dask-jobqueue   # for NCAR PBSCluster on Casper / Derecho
  - dask-gateway    # for cloud / JupyterHub gateway setups

  # Misc
  - tqdm
  - psutil            # mesaclip_regrid_sst (memory reporting)
  - statsmodels       # urban_heat_minicubes
  - pillow            # urban_heat_minicubes (import PIL)

  # Jupyter
  - jupyterlab
  - ipykernel
  - ipywidgets

  - pip
  - pip:
      - heatindex
      - pelicanfs     # cmip6_gmst (OSDF access)
